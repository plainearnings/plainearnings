  .not-found {

  }
  .not-found h1 {

    letter-spacing: -1.2px;

  }
  .not-found .sub {

  }
  .countdown-wrap {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;

  }
  .countdown {

  }
  .countdown-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
  }
  .not-found .go-now {
    display: inline-block;
    font-size: 15.5px;

    color: #fff;
    background: var(--ink);
    text-decoration: none;

    padding: 12px 18px;
  }

  @media (max-width: 640px) {
    .not-found { padding-top: 36px; }
    .not-found h1 { font-size: 32px; }
    .countdown { font-size: 48px; }
  }
</style>

<main class="not-found">
  <span class="code">404</span>
  <h1>We couldn’t find that page.</h1>
  <p class="sub">The link may be old, mistyped, or the report hasn’t been published yet. Taking you home in a moment.</p>

  <div class="countdown-wrap" aria-live="polite">
    <span id="countdown" class="countdown">10</span>
    <span class="countdown-label">seconds until redirect</span>
  </div>

  <p><a class="go-now" id="go-home" href="https://plainearnings.github.io/">Go home now</a></p>
</main>

<script>
(function () {
  var home = "https://plainearnings.github.io/";
  var seconds = 10;
  var el = document.getElementById("countdown");

  function redirect() {
    location.replace(home);
  }

  function tick() {
    el.textContent = String(seconds);
    if (seconds <= 0) {
      redirect();
      return;
    }
    seconds -= 1;
    setTimeout(tick, 1000);
  }

  tick();
})();
</script>
</body>
